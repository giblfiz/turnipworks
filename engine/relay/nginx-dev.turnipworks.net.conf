# dev.turnipworks.net — Turnip Works DEV (2026-10-19; docs/NETCODE.md "Two servers"): the same site as turnipworks.net,
# but on the DEV tree every deploy writes (engine/deploy.sh, tools/spawn-tuner/deploy.sh) and the DEV relay
# (tw-relay-dev, :8098, its own campaigns). Restarts are free here. No login for now; the page wears a DEV ribbon.
# Also answers at http://127.0.0.1:8180/ on the build box itself (the box-local door the live test suites use: no DNS,
# no Cloudflare, a secure context). Cloudflare terminates TLS (SSL mode Flexible) once the DNS record exists.
# Installed copy: /etc/nginx/sites-available/dev.turnipworks.net.
server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:8180;
    server_name dev.turnipworks.net;
    add_header X-Robots-Tag "noindex, nofollow" always;

    if ($http_cf_visitor ~* '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    root /var/www/implausible-landing/projects/turnip-works;

    # the game at "/": engine/client/index.turnipworks.html (<base href="/engine/client/">; deploy: engine/deploy.sh)
    location = / {
        try_files /engine/client/index.turnipworks.html =404;
        add_header Cache-Control "no-cache";
    }
    # the same page at the client folder's own address (2026-10-11). Without this the folder answers with index.html,
    # the OTHER site's page, which looks for the tuner at /tuner/ (a 301 to another origin: the browser refuses it and the
    # game never loads). Invite links made 2026-10-07..11 carry this address: they must keep opening.
    # (exact matches: the ^~ prefix below would win over a regex)
    location = /engine/client/ {
        try_files /engine/client/index.turnipworks.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /engine/client/index.html {
        try_files /engine/client/index.turnipworks.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /engine/ {
        try_files $uri $uri/ =404;
    }
    # the game imports the Spawn Tuner's look code, data and assets LIVE; only those parts are exposed here
    # ASSET DELIVERY (2026-10-11, docs/ASSET_DELIVERY.md in the repo).
    # Delivered copies (tuner/assets/d/, built by tools/spawn-tuner/prep/delivery.py) carry a token in their name that
    # changes with their bytes, and the wall kit's pictures carry a hash in theirs: both are cached for good.
    # (regex locations are tried in order: these two must stay ABOVE the general /look/ one)
    location ~ ^/look/(assets/(d|wallkit)/.+)$ {
        alias /var/www/implausible-landing/projects/turnip-works/tuner/$1;
        types { model/gltf-binary glb; image/webp webp; image/png png; image/jpeg jpg jpeg; application/json json; }
        gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024; gzip_types model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # every other mesh file (the sources, still asked for by a browser running an older client): the right type, gzip
    location ~ ^/look/(assets/.+\.glb)$ {
        alias /var/www/implausible-landing/projects/turnip-works/tuner/$1;
        types { model/gltf-binary glb; }
        gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024; gzip_types model/gltf-binary;
    }
    location ~ ^/look/((js|data|assets)/.+|version\.json)$ {
        alias /var/www/implausible-landing/projects/turnip-works/tuner/$1;
    }
    location /look/ { return 404; } # nothing else of the tuner (its page lives on implausible.enterprises)
    # the game's old address
    location = /play { return 301 /; }
    location ^~ /play/ { return 301 /; }

    include /opt/turnip-works/engine/relay/nginx-location-dev.conf;

    location /api/tw-ratings/ {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8096/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # everything else (tuner, review, review-02, openclose, the old landing page …) lives on implausible.enterprises
    location / {
        return 301 https://implausible.enterprises/projects/turnip-works$request_uri;
    }
}
