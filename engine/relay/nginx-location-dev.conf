# Turnip Works DEV relay (2026-10-19; docs/NETCODE.md "Two servers"): tw-relay-dev.service on 127.0.0.1:8098.
# Included from the dev.turnipworks.net and implausible.enterprises server blocks (prod: nginx-location.conf, :8097).
location /api/tw-relay/admin/ { return 404; }    # operator notices: from the box only (tools/release.sh)
# UPLOADED MODELS (2026-11-06, relay/uploads.js; docs/UPLOADS.md): a model file is up to 32 MB, over the 8 MB below. Only
# the upload address gets the bigger cap, and the body streams to the relay (which counts it and stops at 32 MB itself).
location ~ ^/api/tw-relay/c/[A-Za-z0-9_]+/uploads$ {
    rewrite ^/api/tw-relay/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    client_max_body_size 33m;
    access_log off;
    add_header Cache-Control "no-store" always;
}
location /api/tw-relay/ {
    proxy_pass http://127.0.0.1:8098/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # websocket at /api/tw-relay/ws
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 8m;
    access_log off;                              # GET API URLs carry seat tokens: keep them out of logs
    add_header Cache-Control "no-store" always;
}
