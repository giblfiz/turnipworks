# Turnip Works DEV relay (2026-10-19; docs/NETCODE.md "Two servers"): tw-relay-dev.service on 127.0.0.1:8098.
# Included from the dev.turnipworks.net and implausible.enterprises server blocks (prod: nginx-location.conf, :8097).
location /api/tw-relay/admin/ { return 404; }    # operator notices: from the box only (tools/release.sh)
location /api/tw-relay/ {
    proxy_pass http://127.0.0.1:8098/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # websocket at /api/tw-relay/ws
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 8m;
    access_log off;                              # GET API URLs carry seat tokens: keep them out of logs
    add_header Cache-Control "no-store" always;
}
