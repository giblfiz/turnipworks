# turnipworks.net — Turnip Works PROD: the GAME at the root (Harry 2026-10-02: "should drop you straight into the game").
# PROD SERVES A PINNED RELEASE (2026-10-19; docs/NETCODE.md "Two servers"): /var/lib/tw-releases/current, a link that
# tools/release.sh moves (the nightly roll, promote-now, rollback). Deploys go to dev.turnipworks.net
# (nginx-dev.turnipworks.net.conf) and never change what this site serves. Installed copy: /etc/nginx/sites-available/.
# The tools (tuner, reviews, open/close pilot, the old landing page) live only on implausible.enterprises; every other
# path here 301s to its equivalent there. Cloudflare terminates TLS (SSL mode Flexible); this origin is HTTP-only on :80.
server {
    listen 80;
    listen [::]:80;
    server_name turnipworks.net www.turnipworks.net;

    if ($http_cf_visitor ~* '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }
    if ($host = www.turnipworks.net) {
        return 301 https://turnipworks.net$request_uri;
    }

    root /var/lib/tw-releases/current;

    # the game at "/": engine/client/index.turnipworks.html (<base href="/engine/client/">; deploy: engine/deploy.sh)
    location = / {
        try_files /engine/client/index.turnipworks.html =404;
        add_header Cache-Control "no-cache";
    }
    # the same page at the client folder's own address (2026-10-11). Without this the folder answers with index.html,
    # the OTHER site's page, which looks for the tuner at /tuner/ (a 301 to another origin: the browser refuses it and the
    # game never loads). Invite links made 2026-10-07..11 carry this address: they must keep opening.
    # (exact matches: the ^~ prefix below would win over a regex)
    location = /engine/client/ {
        try_files /engine/client/index.turnipworks.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /engine/client/index.html {
        try_files /engine/client/index.turnipworks.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /engine/ {
        try_files $uri $uri/ =404;
    }
    # the game imports the Spawn Tuner's look code, data and assets LIVE; only those parts are exposed here
    # ASSET DELIVERY (2026-10-11, docs/ASSET_DELIVERY.md in the repo).
    # Delivered copies (tuner/assets/d/, built by tools/spawn-tuner/prep/delivery.py) carry a token in their name that
    # changes with their bytes, and the wall kit's pictures carry a hash in theirs: both are cached for good.
    # (regex locations are tried in order: these two must stay ABOVE the general /look/ one)
    location ~ ^/look/(assets/(d|wallkit)/.+)$ {
        alias /var/lib/tw-releases/current/tuner/$1;
        types { model/gltf-binary glb; image/webp webp; image/png png; image/jpeg jpg jpeg; application/json json; }
        gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024; gzip_types model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # every other mesh file (the sources, still asked for by a browser running an older client): the right type, gzip
    location ~ ^/look/(assets/.+\.glb)$ {
        alias /var/lib/tw-releases/current/tuner/$1;
        types { model/gltf-binary glb; }
        gzip on; gzip_vary on; gzip_comp_level 6; gzip_min_length 1024; gzip_types model/gltf-binary;
    }
    location ~ ^/look/((js|data|assets)/.+|version\.json)$ {
        alias /var/lib/tw-releases/current/tuner/$1;
    }
    location /look/ { return 404; } # nothing else of the tuner (its page lives on implausible.enterprises)
    # which release this is (tools/release.sh writes it; the nightly roll's check reads it)
    location = /release.json { add_header Cache-Control "no-store"; try_files /release.json =404; }
    # the site pages (2026-10-21): About, Terms, Privacy; the VTT comparison index and the help page Connect D&D Beyond (2026-10-29). Copy in docs/site/*.md, built by engine/tools/build_site.py into
    # engine/client/site/ (so a release carries them with the client). /about/ and /about.html land on /about.
    location ~ ^/(about|terms|privacy|vtt-index|connect-dnd-beyond)$ {
        default_type text/html;
        try_files /engine/client/site/$1.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(about|terms|privacy|vtt-index|connect-dnd-beyond)(/|\.html)$ { return 301 /$1; }
    # the VTT comparison index's data (2026-10-29; docs/VTT_INDEX.md): stable addresses for people, scripts and AI assistants
    location ~ ^/vtt-index(\.schema)?\.json$ {
        types { } default_type application/json; charset utf-8; charset_types application/json;
        try_files /engine/client/site/vtt-index$1.json =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
    location = /vtt-index.md {
        types { } default_type text/markdown; charset utf-8; charset_types text/markdown;
        try_files /engine/client/site/vtt-index-md.txt =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
    # search and AI crawlers (2026-10-23): robots.txt, sitemap.xml and llms.txt are written by engine/tools/build_site.py
    # into engine/client/site/, so a release carries them with the client. (They used to fall to the 301 below and 404.)
    # Cloudflare caches robots.txt (4 h): purge https://turnipworks.net/robots.txt after a change goes live.
    location = /robots.txt  { charset utf-8; try_files /engine/client/site/robots.txt =404; add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { try_files /engine/client/site/sitemap.xml =404; add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt    { charset utf-8; try_files /engine/client/site/llms.txt =404; add_header Cache-Control "public, max-age=3600"; }
    # the game's old address
    location = /play { return 301 https://turnipworks.net/; }
    location ^~ /play/ { return 301 https://turnipworks.net/; }

    # SHARE LINKS (2026-10-29; relay/shares.js): /s/<id> is a shared build's unlisted preview page, /s/<id>/json and
    # /s/<id>/thumb its build and picture. The relay serves them (noindex, no script); nothing lists them.
    location ^~ /s/ {
        proxy_pass http://127.0.0.1:8097/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        client_max_body_size 64k;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    include /opt/turnip-works/engine/relay/nginx-location.conf;

    location /api/tw-ratings/ {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8096/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # everything else (tuner, review, review-02, openclose, the old landing page …) lives on implausible.enterprises
    location / {
        return 301 https://implausible.enterprises/projects/turnip-works$request_uri;
    }
}
