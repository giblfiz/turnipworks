# Turnip Works PROD relay (areas, presence, LLM GET API), included from the turnipworks.net server block.
# Relay: tw-relay.service on 127.0.0.1:8097, the current release. (Since 2026-10-19 implausible.enterprises includes
# nginx-location-dev.conf, the dev relay on :8098; docs/NETCODE.md "Two servers".)
location /api/tw-relay/admin/ { return 404; }    # operator notices: from the box only (tools/release.sh)
location /api/tw-relay/ {
    proxy_pass http://127.0.0.1:8097/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # websocket at /api/tw-relay/ws
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_read_timeout 3600s;                    # sockets idle-ping every 2 s; long-polls wait <= 30 s
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 8m;                     # a whole building is one command (<= 1 MB, the relay checks); a GM snapshot of an area may be bigger
    access_log off;                              # GET API URLs carry seat tokens: keep them out of logs
    add_header Cache-Control "no-store" always;
}
