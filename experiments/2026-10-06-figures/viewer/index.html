<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnip Works: figures pilot</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a09; color: #e8e4d8; font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #bar a.home { color: #cfc9b4; text-decoration: none; margin-right: 6px; }
  button, label.chk { background: #2b2925; color: #e8e4d8; border: 1px solid #4e4a40; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { background: #7a5a2c; border-color: #c79a4e; }
  label.chk input { vertical-align: -2px; margin-right: 4px; }
  .sep { width: 10px; }
  #panel { position: fixed; left: 10px; bottom: 10px; width: min(450px, 94vw); max-height: 78vh; overflow: auto; background: #171513e6; border: 1px solid #3d3a33; border-radius: 8px; padding: 10px 12px; }
  #panel h3 { margin: 0 0 4px; font-size: 15px; color: #f0d9a8; }
  #panel h4 { margin: 10px 0 4px; font-size: 13px; color: #f0d9a8; font-weight: 600; }
  #panel p { margin: 4px 0 8px; color: #c9c4b4; }
  .row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; margin: 4px 0; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; color: #f0d9a8; }
  input[type=range] { width: 100%; }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .opts button { padding: 5px 8px; }
  .sw { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid #4e4a40; }
  .sw.on { border-color: #fff; background-clip: padding-box; }
  .fig { border-top: 1px solid #3d3a33; padding: 7px 0 4px; }
  .fig.cur { background: #221f1a; margin: 0 -12px; padding: 7px 12px 4px; }
  .fig b { color: #f0d9a8; } .fig .facts { color: #b9b4a4; font-size: 12.5px; margin: 2px 0 5px; font-variant-numeric: tabular-nums; }
  .fig .facts .bad { color: #ff9a7a; } .fig .facts .good { color: #a9d68a; }
  .fig textarea { width: 100%; box-sizing: border-box; min-height: 30px; height: 30px; background: #0f0e0c; color: #e8e4d8; border: 1px solid #4e4a40; border-radius: 6px; padding: 5px; font: inherit; }
  select { background: #2b2925; color: #e8e4d8; border: 1px solid #4e4a40; border-radius: 5px; padding: 3px 4px; font: inherit; max-width: 250px; }
  .tierrow { display: flex; gap: 6px; align-items: center; margin: 3px 0 5px; font-size: 12.5px; color: #b9b4a4; } .tierrow button { padding: 3px 8px; }
  .verdict { display: flex; gap: 6px; margin-top: 4px; } .verdict button { flex: 1; padding: 7px; font-weight: 600; }
  .verdict .good { background: #35502c; border-color: #6f9a5a; } .verdict .bad { background: #5a302a; border-color: #a8685c; }
  .sent { color: #a9d68a; min-height: 1.2em; font-size: 12.5px; }
  #status { position: fixed; right: 10px; bottom: 10px; color: #8d897c; font-size: 12px; }
  #fps { position: fixed; right: 10px; bottom: 28px; color: #cfc9b4; font-size: 12px; font-variant-numeric: tabular-nums; background: #171513cc; padding: 2px 7px; border-radius: 5px; }
  #hide { float: right; padding: 2px 8px; }
  #panel.min > :not(h3) { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "postprocessing": "./lib/vendor/postprocessing-6.39.5.js",
  "n8ao": "./lib/vendor/n8ao-2.0.1.js",
  "three-good-godrays": "./lib/vendor/three-good-godrays-0.12.1.js"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <a class="home" href="../">← Turnip Works</a>
  <a class="home" href="./set/" style="color:#f0d9a8">The figure set (gallery) →</a>
  <span id="scenes"></span><span class="sep"></span>
  <span id="views"></span><span class="sep"></span>
  <label class="chk"><input type="checkbox" id="spin">Turntable (6 rpm)</label>
  <label class="chk"><input type="checkbox" id="night">Night (the game's look)</label>
  <label class="chk"><input type="checkbox" id="grid">5-ft grid</label>
  <label class="chk" title="How detailed every figure's file is. Each figure can also be set on its own in the panel.">Detail <select id="tier"></select></label>
  <label class="chk" title="The wolf and the goblin were made twice. The second tries have changed descriptions: a leaner, greyer wolf with no neck ruff; a goblin with a taller, pale spear. Untick to see the first tries."><input type="checkbox" id="second">Second-try wolf and goblin</label>
  <label class="chk"><input type="checkbox" id="standin">Old stand-in pawn beside each</label>
</div>
<div id="panel">
  <h3><button id="hide" title="Hide or show this panel">–</button><span id="title"></span></h3>
  <p id="note"></p>
  <h4>Base (added by the page, not part of the mesh)</h4>
  <div class="opts" id="bases"></div>
  <div class="row"><span>Seat colour</span><span class="opts" id="colors"></span><span></span></div>
  <div class="row"><span>Base width</span><input type="range" id="s-size" min="0.5" max="1" step="0.01"><output id="r-size"></output></div>
  <div class="row"><span>Facing mark</span><span><label><input type="checkbox" id="notch"> a small arrow at the front</label></span><span></span></div>
  <h4>Your verdict, per figure</h4>
  <div id="figs"></div>
</div>
<div id="status">loading…</div>
<div id="fps" title="Frames drawn in the last second, and the size the picture is drawn at. The page only draws while something moves."></div>
<script type="module" src="./main.js?v=__V__"></script>
</body>
</html>
