<!doctype html>
<!-- The assets page's thumbnail stage (tools/site-assets/media.py, 2026-11-04): one catalog mesh at a time on a warm
     mid-grey ground (dark iron vanished on a dark one: Gemini, 2026-11-04), with the figure thumbnails' light rig (experiments/2026-10-06-figures/viewer/gallery.js: hemisphere
     #fff4e0/#3a3428 1.7, sun #fff1dc 1.9 from the front left, above) plus a rim and a fill, seen three-quarters from the
     front and a little above (higher for flat things), framed to fill the square. window.__shot({file, yaw}) draws one
     and answers {ok, png, box} or {ok: false, err}. -->
<meta charset="utf-8">
<style>html, body { margin: 0; background: #77726a; } canvas { display: block; }</style>
<canvas id="c" width="512" height="512"></canvas>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const S = 512;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(S, S, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#77726a');
scene.add(new THREE.HemisphereLight('#fff4e0', '#3a3428', 1.7));
const sun = new THREE.DirectionalLight('#fff1dc', 1.9); sun.position.set(-120, 120, 100); scene.add(sun);
// a rim from behind and a soft fill from the right, so dark iron and shadowed sides keep their edges
// (Gemini, 2026-11-04: cell bars "too dark", the brazier "untextured grey")
const rim = new THREE.DirectionalLight('#dfe8ff', 1.3); rim.position.set(40, 90, -140); scene.add(rim);
const fill = new THREE.DirectionalLight('#fff4e6', 0.55); fill.position.set(140, 30, 60); scene.add(fill);
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
const loader = new GLTFLoader();
let current = null;
// the view: from the front (+Z, the catalog's front) turned 35° to the right; the elevation per shot, below
const AZ = 35 * Math.PI / 180, MARGIN = 1.08;
window.__shot = async ({ file, yaw = 0 }) => {
  try {
    if (current) { scene.remove(current); current.traverse(o => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach(m => { m.map?.dispose(); m.dispose(); }); } }); current = null; }
    const g = (await loader.loadAsync(file)).scene;
    const holder = new THREE.Group(); holder.add(g); holder.rotation.y = yaw * Math.PI / 180; scene.add(holder); current = holder;
    holder.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(holder); if (box.isEmpty()) return { ok: false, err: 'empty mesh' };
    // a low, flat thing (a shaving kit, a scatter of papers) is seen from higher up: from 24° it is a sliver
    const sz = box.getSize(new THREE.Vector3()), flat = sz.y / Math.max(sz.x, sz.z, 1e-6), EL = (flat < 0.3 ? 48 : flat < 0.6 ? 34 : 24) * Math.PI / 180;
    const c = box.getCenter(new THREE.Vector3()), dir = new THREE.Vector3(Math.sin(AZ) * Math.cos(EL), Math.sin(EL), Math.cos(AZ) * Math.cos(EL));
    // fit: the box's eight corners must all be inside the view (a tight frame, not the bounding sphere's loose one)
    const corners = []; for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) corners.push(new THREE.Vector3(x, y, z));
    const span = box.getSize(new THREE.Vector3()).length();
    let lo = span * 0.3, hi = span * 20;
    // (each try sets its own planes: the last shot's would cut this one off)
    const fits = (d) => { camera.near = d / 100; camera.far = d * 10; camera.position.copy(c).addScaledVector(dir, d); camera.lookAt(c); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      return corners.every(p => { const q = p.clone().project(camera); return Math.abs(q.x) * MARGIN <= 1 && Math.abs(q.y) * MARGIN <= 1 && q.z < 1; }); };
    for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (fits(m)) hi = m; else lo = m; }
    fits(hi); camera.near = hi / 50; camera.far = hi * 4; camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    const b = box.getSize(new THREE.Vector3());
    return { ok: true, png: renderer.domElement.toDataURL('image/png'), box: [b.x, b.y, b.z].map(v => +v.toFixed(3)) };
  } catch (e) { return { ok: false, err: String(e?.message || e) }; }
};
window.__ready = true;
</script>
